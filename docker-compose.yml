# GitHub Actions runners on a Windows Server 2022 VM, built on dockur/windows.
# dockur boots QEMU directly and installs Windows from the Microsoft evaluation
# ISO on first start; oem/install.bat then installs the toolchain and registers
# the runners. Later starts boot the installed VM; a logon task in the VM
# re-applies runner.env only when it changed or an earlier run did not finish.
#
# Settings live in .env (copy .env.example). Compose reads it for the ${...}
# values below, and the same file is bind-mounted into the VM's shared folder
# so install.ps1 can read RUNNER_URL, PAT, RUNNERS, ... from there. Nothing from
# .env goes into /oem: dockur bakes that folder into the install ISO it keeps
# under ./storage, and a PAT should not end up in there.
services:
  windows-github-runner:
    image: dockurr/windows:6.06
    environment:
      VERSION: "${VERSION:-2022}"
      RAM_SIZE: "${RAM_SIZE:-8G}"
      CPU_CORES: "${CPU_CORES:-4}"
      DISK_SIZE: "${DISK_SIZE:-100G}"
      USERNAME: "${WIN_USERNAME:-admin}"
      PASSWORD: "${WIN_PASSWORD:-runner}"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    # QEMU 10.1+ uses io_uring for its event loop and, on recent kernels, for the
    # disk. io_uring rings are locked memory, and the container default of a few
    # hundred KB makes QEMU exit at boot with "Failed to initialize io_uring:
    # Cannot allocate memory". Unlimited is what the QEMU and Elasticsearch
    # docs recommend; it is not a privilege.
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 8006:8006 # web console (noVNC), handy during the first install
      - 3389:3389/tcp # RDP
      - 3389:3389/udp
    volumes:
      - ./oem:/oem:ro # install.bat + install.ps1, copied to C:\OEM at install time
      - ./storage:/storage # Windows disk + install ISO, persists across restarts
      # Stock Windows ISO kept outside storage/: a wipe of storage/ then skips
      # the 5 GB download. Get the URL from the container log of a first start.
      # - ./win2022.iso:/custom.iso:ro
      - ./shared:/shared # \\host.lan\Data (Z:) in the VM; install.log lands here
      # read by install.ps1. Every process in the VM, CI jobs included, can read
      # this share: comment the line out once the runners are registered.
      - ./.env:/shared/runner.env:ro
    restart: unless-stopped
    stop_grace_period: 2m
